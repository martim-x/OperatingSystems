[Daemon]
# Отключаем энергосбережение: сон, затемнение, блокировку
# Действуют, пока включён inhibit-lock в ~/.config/autostart/no-suspend.desktop

[Activity]
acBrightness=0
dcBrightness=100
dimWhenInactive=0
dimOnBrightness=0

[DPMS]
disableEnergyManagement=1

[ScreenBrightness]
enableBrightnessControl=0

[AutoSuspend]
suspendWhenInactive=0
suspendType=0